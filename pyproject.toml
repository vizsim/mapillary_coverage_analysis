[project]
name = "mapillary-coverage-analysis"
version = "0.1.0"
description = "Aggregiert die Mapillary-Coverage von OSM-Hauptstraßen pro Bundesland/Kreis/Gemeinde zu PMTiles."
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Nur direkte Abhängigkeiten von preprocessing/*.py; exakte Versionen stehen in uv.lock.
dependencies = [
    "geopandas>=1.1.1,<2",
    "pandas>=2.3.1,<3",
    "psutil>=7.0.0",
    "pyogrio>=0.11.1",
]
